version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel-app

    working_dir: /var/www

    volumes:
      - ./src:/var/www

    networks:
      - laravel

  nginx:
    image: nginx:stable-alpine

    container_name: laravel-nginx

    ports:
      - "8000:80"

    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel

networks:
  laravel:
